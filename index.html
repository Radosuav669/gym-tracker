<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Journal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link rel="stylesheet" href="css/style.css?v=3">
<script src="js/theme.js"></script>
</head>
<body>

<div class="container">
    <!-- Login Screen -->
    <div id="login-box" class="card">
        <h2>Gym Tracker Login</h2>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="your@mail.com">
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button id="btn-login">Log in</button>
    </div>

    <!-- App Screen (hidden until logged in) -->
    <div id="app-box" class="hidden">

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="workout">Workout</button>
            <button class="tab-btn" data-tab="progress">Progress</button>
        </div>

        <!-- Workout Tab -->
        <div id="tab-workout" class="tab-content active">
            <div class="selection-container">
                <select id="day-select">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>
                <select id="week-select">
                    <option value="Even">Even Week</option>
                    <option value="Odd">Odd Week</option>
                </select>
            </div>

            <h1 id="today-title">Workout</h1>
            <p id="week-info"></p>
            <div id="workout-container"></div>
        </div>

        <!-- Progress Tab -->
        <div id="tab-progress" class="tab-content">
            <h2>Weekly Training Volume</h2>
            <div class="date-range">
                <label class="date-picker-wrapper" title="From date">
                    <input type="date" id="progress-date-from" class="hidden-date-input">
                    <span class="date-display" id="progress-date-from-display">dd/mm/yyyy</span>
                </label>
                <span style="color:var(--muted-text);">—</span>
                <label class="date-picker-wrapper" title="To date">
                    <input type="date" id="progress-date-to" class="hidden-date-input">
                    <span class="date-display" id="progress-date-to-display">dd/mm/yyyy</span>
                </label>
            </div>

            <!-- Chart Container -->
            <div class="card chart-card">
                <canvas id="progress-chart"></canvas>
            </div>
        </div>

        <button id="btn-logout">Logout</button>

        <!-- Exercise History Modal -->
        <div id="history-modal" class="modal hidden">
            <div class="modal-content card">
                <div class="modal-header">
                    <h3 id="history-modal-title">Exercise History</h3>
                    <button class="btn-close" id="history-modal-close">&times;</button>
                </div>
                <div id="history-table-container"></div>
                <canvas id="history-chart"></canvas>
            </div>
        </div>
    </div>

    <!-- Theme selector — always visible at bottom -->
    <div class="theme-selector-container">
        <select id="theme-select">
            <option value="default">Default</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="ocean">Ocean</option>
        </select>
    </div>
</div>

<div class="footer">Created by Radoslaw</div>

<script src="js/supabase-config.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/progress.js?v=2" defer></script>
<script src="js/workout.js?v=4" defer></script>
</body>
</html>
